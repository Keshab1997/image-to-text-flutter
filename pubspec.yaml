name: snaptext_ocr
description: "SnapText OCR — Smart AI Image to Text Scanner by Keshab Studios."
publish_to: 'none'

version: 1.1.0+7

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  image_picker: ^1.1.2
  image_cropper: ^10.0.0
  google_mlkit_text_recognition: ^0.15.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  permission_handler: ^11.4.0
  url_launcher: ^6.3.1
  tesseract_ocr: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/mascot_hero.png
    - assets/images/mascot_avatar.png
    - assets/tessdata_config.json
    - assets/tessdata/ben.traineddata
